<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Dodgy Blobby</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Blobby">
    <meta name="theme-color" content="#1f1915">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <script defer src="script.js" charset="utf-8"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Bungee|Bungee+Shade" rel="stylesheet">
  </head>
  <body class='body'>
    <section id="mainMenu">
      <div class="title">DODGY<br/>BLOBBY</div>
      <div class="buttons">
        <button type="button" id="start" name="start">START</button>
      </div>
    </section>
    <section id="loseMenu">
      <div class="tryAgain">TRY AGAIN</div>
      <div class="buttons">
        <button type="button" id="yes" name="yes">YES</button>
        <button type="button" id="no" name="no">NO</button>
      </div>
      <div class="finalScore">score:</div>
    </section>
    <section id="upgradeMenu">
      <div class="waveTitle"></div>
      <div class="cards"></div>
    </section>
    <div class="player"></div>
    <div class="currentScore">score:</div>
  </body>
</html>
